[sdl]
output=surface
[dosbox]
machine=vgaonly
memsize=8
[cpu]
cputype=386
core=normal
cycles=fixed 5000
[sblaster]
sbtype=sb16
sbbase=220
irq=5
dma=1
hdma=5
[autoexec]
mount c /home/ccd/accessible_os/freedos/share
c:
set BLASTER=A220 I5 D1 H5 P330 T6
del c:\out\et5.txt
del c:\out\eb5.txt
c:\espk\espkd com3 /test > c:\out\et5.txt
c:\espk\espkd com3 /c c:\espk\bench.bat c:\out\eb5.txt
c:\espk\espkd com3 /c c:\espk\pvbench.bat c:\out\ep5.txt > c:\out\epl5.txt
c:\espk\espkd com3 /pmall /c c:\espk\pvbench.bat c:\out\epa5.txt > c:\out\epal5.txt
c:\espk\espkd com3 /c c:\espk\i14bench.bat c:\out\ei5.txt > nul
c:\espk\espkd com3 /pmall /c c:\espk\i14bench.bat c:\out\eia5.txt > nul
c:\espk\int14b 5000 > c:\out\eib5.txt
exit
