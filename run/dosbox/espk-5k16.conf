[sdl]
output=surface
[dosbox]
machine=vgaonly
memsize=8
[cpu]
cputype=386
core=normal
cycles=fixed 5000
[sblaster]
sbtype=sb16
sbbase=220
irq=5
dma=1
hdma=5
[autoexec]
mount c /home/ccd/accessible_os/freedos/share
c:
set BLASTER=A220 I5 D1 H5 P330 T6
c:\espk\espk -q -r 16000 -n 5 Hello. This is the Klatt synthesizer speaking on Free DOS. The quick brown fox jumps over the lazy dog. > c:\out\espk16k.txt
exit
