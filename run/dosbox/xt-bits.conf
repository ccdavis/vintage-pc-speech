[sdl]
output=surface
[dosbox]
machine=cga
memsize=1
[cpu]
cputype=8086
core=normal
cycles=fixed 315
[sblaster]
sbtype=sb2
sbbase=220
irq=5
dma=1
[speaker]
pcspeaker=true
pcrate=44100
[mixer]
rate=44100
nosound=false
[autoexec]
mount c /home/ccd/accessible_os/freedos/share
c:
set BLASTER=A220 I5 D1 T3
sbtalk com3 /retro /bits /say Hello. This is the nineteen eighty three voice on an X T. One two three four five. > c:\out\xtbits.txt
exit
