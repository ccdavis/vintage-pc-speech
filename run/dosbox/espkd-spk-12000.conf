[sdl]
output=surface
[dosbox]
machine=vgaonly
memsize=8
[cpu]
cputype=386
core=normal
cycles=fixed 12000
[sblaster]
sbtype=sb16
sbbase=220
irq=5
dma=1
hdma=5
[autoexec]
mount c /home/ccd/accessible_os/freedos/share
c:
set BLASTER=A220 I5 D1 H5 P330 T6
del c:\out\est12.txt
del c:\out\esb12.txt
c:\espk\espkd com3 /spk /test > c:\out\est12.txt
c:\espk\espkd com3 /spk /c c:\espk\bench.bat c:\out\esb12.txt
exit
