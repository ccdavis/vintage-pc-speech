name: build
on: [push, pull_request]
jobs:
  exes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: uv (used by the data/cwsdpmi tools)
        run: curl -LsSf https://astral.sh/uv/install.sh | sh && echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: toolchains
        run: TOOLS=$HOME/tools bash run/get-toolchains.sh
      - name: build the DOS programs
        run: |
          export TOOLS=$HOME/tools WATCOM=$HOME/tools/ow DJ=$HOME/tools/djgpp/bin
          make -C src/sbtalk SBTALK.EXE SBTALK3.EXE SBTALKXT.EXE SAY.EXE
          make -C src/espeak ESPK.EXE ESPKD.EXE
          make -C src/klatt klattsay   # the parity check needs the upstream float source (not in the repo)
          bash run/get-dectalk.sh && make -C src/dectalk DTSAY.EXE DTALKD.EXE   # engine source fetched from github.com/dectalk/dectalk
      - uses: actions/upload-artifact@v4
        with:
          name: dos-programs
          path: |
            src/sbtalk/*.EXE
            src/espeak/*.EXE
            src/dectalk/*.EXE
